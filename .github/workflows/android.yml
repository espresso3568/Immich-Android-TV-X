name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Prepare credential-free resource placeholders
      run: |
        cat > app/src/main/res/values/strings_other.xml <<'XML'
        <resources>
            <string name="host_name" translatable="false"></string>
            <string name="api_key" translatable="false"></string>
            <string name="authentication_url" translatable="false">https://example.invalid/authentication-disabled</string>
        </resources>
        XML

    # APKs are built for local validation only and are never uploaded or published.
    - name: Build debug app and run unit tests
      run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :mediaslider:mediaslider:testDebugUnitTest --console=plain --max-workers=2
